[tox]
envlist = ty, lowest, py3.{13,14,15}

[testenv]
package = wheel
wheel_build_env = .pkg
deps =
    pytest
# what follows `--` is passed to pytest, so that `tox r -e py3.14 --
# tests/test_scihub_tools.py` runs one module in the environment
commands =
    pytest {posargs}

[testenv:ty]
passenv =
    TY_OUTPUT_FORMAT
deps =
    ty
    pytest
commands =
    ty check

[testenv:lowest]
# the lower bounds of `pyproject.toml` are a promise to every user who installs
# pkpdbib next to other packages: this environment installs the oldest version
# each of them allows (`lowest-direct`, the dependencies of those stay at their
# newest) on the oldest supported python and runs the suite against it
basepython = python3.13
uv_resolution = lowest-direct
# the resolution applies to the test runner as well, which has to stay current
deps =
    pytest>=9.1.1
